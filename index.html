<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23e8382f'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%90%80%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🐀', '#e8382f');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --yellow: #ffd400;
    --gold: #ffc21a;
    --red: #e8382f;
    --deep: #b51f18;
    --jade: #3fd0a0;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #8fd0f0; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; z-index: 12; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  kbd { font: 400 11px/16px var(--display); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 0 4px; white-space: nowrap; }
  @media (hover: none) and (pointer: coarse) { .ctl kbd, .buddybtn kbd { display: none; } }

  .bigbtn {
    width: clamp(64px, 11vmin, 100px); height: clamp(64px, 11vmin, 100px); border-radius: 26px;
    font-size: clamp(30px, 5.6vmin, 50px); line-height: 1; display: grid; place-items: center; flex-shrink: 0;
    background: linear-gradient(160deg, #ffffff, #ffeccc); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #ff6b5b, #d8261c); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn:active, .card:active, .who button:active, .lvl button:active, .ibtn:active, .buddybtn:active, .tile:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: 46px; height: 46px; border-radius: 14px; font-size: 22px; line-height: 1; flex-shrink: 0;
    display: grid; place-items: center; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.45);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.5vh, 14px); padding: 10px; transition: opacity 0.3s; }
  @media (min-aspect-ratio: 11/10) { #home { left: 36vw; right: 0; top: 0; bottom: 0; padding-right: max(10px, var(--safe-r)); } }
  @media (max-aspect-ratio: 11/10) { #home { left: 0; right: 0; bottom: calc(var(--safe-b) + 4px); height: 66vh; } }
  .logo { text-align: center; font-family: var(--display); line-height: 0.9; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(20px, 4vmin, 36px); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(36px, 8.4vmin, 80px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(232, 56, 47, .7); white-space: nowrap; }
  .logo em { display: block; font-style: normal; font-size: clamp(12px, 2.2vmin, 18px); color: #fff; -webkit-text-stroke: 3px var(--deep); paint-order: stroke fill; margin-top: 4px; letter-spacing: 1px; }
  .cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(4px, 1vmin, 10px); width: min(100%, 760px); }
  @media (max-aspect-ratio: 11/10) { .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    padding: clamp(3px, 0.8vmin, 8px) 2px; border-radius: 18px; border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink);
    background: radial-gradient(circle at 50% 30%, #ffffff88, transparent 62%), #ffe9c2; color: var(--ink); min-height: clamp(62px, 11vmin, 104px);
    transition: transform 0.12s;
  }
  .card .num { position: absolute; left: 4px; top: 3px; font: 400 clamp(10px, 1.7vmin, 14px)/1 var(--display); color: var(--deep); }
  .card .emo { font-size: clamp(26px, 5.4vmin, 50px); line-height: 1.05; filter: drop-shadow(0 3px 0 rgba(20, 18, 31, 0.25)); }
  .card .nm { font-family: var(--display); font-size: clamp(9px, 1.6vmin, 14px); line-height: 1.05; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .card .py { font-weight: 800; font-size: clamp(10px, 1.7vmin, 14px); line-height: 1.1; color: var(--deep); }
  .card .faces { position: absolute; right: -6px; top: -8px; display: flex; }
  .card .faces img { width: clamp(22px, 4vmin, 34px); height: clamp(22px, 4vmin, 34px); border-radius: 50%; border: 2px solid var(--ink); background: #ffd27a; }
  .card.on { transform: scale(1.06); border-color: var(--yellow); background: radial-gradient(circle at 50% 30%, #ffffffaa, transparent 62%), #ffd25a; box-shadow: 0 0 0 3px var(--ink), 0 6px 0 3px var(--ink), 0 0 22px 5px rgba(255, 212, 0, .7); z-index: 2; }
  .card.on2 { border-color: #ffb02e; }
  .who { display: flex; gap: clamp(6px, 1.6vmin, 16px); }
  .who button {
    position: relative; display: flex; align-items: center; gap: 6px; height: clamp(50px, 9vmin, 80px); padding: 0 12px 0 5px; border-radius: 20px;
    border: 4px solid #fff; background: rgba(20, 18, 31, 0.55); box-shadow: 0 5px 0 var(--ink); font-family: var(--display); font-size: clamp(12px, 2.2vmin, 19px);
  }
  .who img { height: 84%; aspect-ratio: 1; border-radius: 15px; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffb02e); }
  .who .duo { display: flex; height: 84%; }
  .who .duo img { height: 100%; }
  .who .duo img + img { margin-left: -14px; }
  .who .cups { position: absolute; right: -6px; top: -10px; font: 400 12px/18px var(--display); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 9px; padding: 0 5px; }
  .who .cups:empty { display: none; }
  .who button.on { background: linear-gradient(160deg, #ffe680, #ffb02e); color: var(--ink); border-color: var(--yellow); box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px var(--ink); }
  .homerow { display: flex; align-items: center; gap: clamp(8px, 2vmin, 18px); flex-wrap: wrap; justify-content: center; }
  .lvls { display: flex; gap: 8px; }
  .lvl { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 20px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; }
  .lvl img { width: clamp(32px, 5.6vmin, 46px); height: clamp(32px, 5.6vmin, 46px); border-radius: 12px; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffb02e); }
  .lvl button { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: clamp(50px, 8.6vmin, 72px); height: clamp(46px, 8vmin, 66px); border-radius: 14px; font-family: var(--display); font-size: clamp(9px, 1.6vmin, 12px); line-height: 1.1; opacity: 0.6; }
  .lvl button span { font-size: clamp(20px, 3.8vmin, 30px); }
  .lvl button.on { opacity: 1; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .extras { display: flex; gap: 8px; }
  .extras .ibtn { width: clamp(50px, 8.6vmin, 70px); height: clamp(50px, 8.6vmin, 70px); border-radius: 18px; font-size: clamp(22px, 4.2vmin, 32px); }
  @media (max-height: 460px) {
    #home { gap: 5px; padding: 5px 8px; }
    .logo small { font-size: 15px; -webkit-text-stroke-width: 2px; text-shadow: 0 2px 0 var(--ink); }
    .logo big { font-size: 30px; -webkit-text-stroke-width: 3px; text-shadow: 0 3px 0 var(--ink); }
    .logo em { font-size: 10px; margin-top: 1px; }
    .card { min-height: 52px; border-width: 3px; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
    .card .emo { font-size: 24px; }
    .card .py { display: none; }
    .who button { height: 46px; font-size: 11px; border-radius: 15px; border-width: 3px; }
    .lvl button { height: 44px; min-width: 46px; }
    .lvl img { width: 28px; height: 28px; }
    .extras .ibtn { width: 46px; height: 46px; font-size: 21px; border-radius: 14px; }
    .bigbtn { width: 58px; height: 58px; font-size: 28px; border-radius: 18px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); }
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  #split { position: fixed; background: var(--ink); z-index: 5; pointer-events: none; }
  #track { position: absolute; left: calc(max(10px, var(--safe-l)) + 62px); right: calc(max(10px, var(--safe-r)) + 112px); top: calc(var(--safe-t) + 12px); height: 38px; border-radius: 19px; background: linear-gradient(90deg, #79c24a 0 10%, #3fb8d0 10% 83%, #79c24a 83%); border: 3px solid #fff; box-shadow: 0 3px 0 var(--ink); }
  #track .flag { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-size: 20px; line-height: 1; }
  #track .mark { position: absolute; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; display: grid; place-items: center; font-size: 17px; line-height: 1; transition: none; }
  #track .mark.me { width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; border: 3px solid var(--yellow); z-index: 2; font-size: 18px; box-shadow: 0 2px 0 var(--ink); }
  .hudright { position: absolute; right: max(10px, var(--safe-r)); top: calc(var(--safe-t) + 8px); display: flex; gap: 8px; pointer-events: auto; }
  .pinfo { position: absolute; display: flex; align-items: center; gap: 6px; font-family: var(--display); pointer-events: none; }
  .pinfo .place { font-size: clamp(26px, 6vmin, 50px); color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); line-height: 1; }
  .pinfo .place.first { color: var(--yellow); }
  .pinfo .chip { font: 800 clamp(12px, 2.2vmin, 17px) 'Rubik', sans-serif; background: rgba(20, 18, 31, 0.6); border: 2px solid #fff; border-radius: 10px; padding: 1px 7px; white-space: nowrap; }
  .pinfo .chip:empty { display: none; }

  /* the buttons: steer, jump and the power, one set per player */
  #pads { position: fixed; inset: 0; pointer-events: none; z-index: 7; }
  .ctl {
    position: absolute; pointer-events: auto; touch-action: none; display: grid; place-items: center; border-radius: 24px; color: #fff;
    background: linear-gradient(170deg, rgba(255,255,255,.4), rgba(255,255,255,0) 55%), rgba(20, 18, 31, 0.5);
    border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink); font-size: 30px; line-height: 1;
  }
  .ctl kbd { position: absolute; left: 50%; bottom: -4px; transform: translate(-50%, 50%); }
  .ctl.down { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); background-color: rgba(255, 212, 0, 0.55); }
  .ctl.jump { border-radius: 50%; background: radial-gradient(circle at 50% 35%, #7df7c8, #1fa37a); }
  .ctl.power { border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3c0, #ffb02e 70%); color: var(--ink); font-size: 38px; }
  .ctl.power .ring { position: absolute; inset: -9px; border-radius: 50%; pointer-events: none; }
  .ctl.power .lbl { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); font: 400 clamp(9px, 1.6vmin, 13px) var(--display); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; white-space: nowrap; }
  .ctl.power .emo { margin-top: 18%; }
  .ctl.power.ready { animation: glow 0.9s ease-in-out infinite; border-color: var(--yellow); }
  .ctl.power.used { filter: saturate(0.4) brightness(0.9); }
  .buddybtn {
    position: fixed; z-index: 7; border-radius: 50%; padding: 4px;
    width: clamp(56px, 10vmin, 80px); height: clamp(56px, 10vmin, 80px);
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink); font-size: clamp(26px, 4.6vmin, 38px);
  }
  .buddybtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .buddybtn kbd { position: absolute; left: -6px; top: -6px; width: 26px; height: 26px; border-radius: 8px; font: 400 14px/20px var(--display); text-align: center; border-width: 3px; padding: 0; }
  .buddybtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 6px 0 var(--ink); } }

  /* ---------- toasts, the count-in ---------- */
  #toasts { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 94vw; }
  .toast { font-family: var(--display); font-size: clamp(17px, 3.8vmin, 34px); color: var(--yellow); text-align: center; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 2.2s ease-out forwards; }
  .toast.buddy { color: #ffb02e; }
  .toast.treat { color: #fff; }
  .toast.good { color: #7df7c8; }
  .toast.place { color: #9fd4ff; }
  .toast.oops { color: #ff9db0; font-size: clamp(15px, 3.2vmin, 26px); }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  #bigCount { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none; opacity: 0; font-family: var(--display); font-size: clamp(90px, 26vmin, 230px); color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); white-space: nowrap; }
  #bigCount.go { color: #ffd400; font-size: clamp(60px, 16vmin, 150px); }
  #bigCount.anim { animation: count 0.7s ease-out forwards; }
  @keyframes count { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 35% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } }

  /* ---------- overlays: pause, results, story, finder, line-up ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(20, 18, 31, 0.4); transition: opacity 0.25s; padding: 10px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(7px, 1.8vh, 14px); padding: clamp(12px, 2.6vmin, 26px); border-radius: 34px; background: linear-gradient(170deg, #fff8e6, #ffe2b8); border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); color: var(--ink); max-width: 96vw; max-height: 94vh; overflow: auto; }
  .rbtns { display: flex; gap: clamp(10px, 2.6vmin, 22px); flex-wrap: wrap; justify-content: center; }
  #pause .panel { flex-direction: row; gap: 22px; }
  #results { background: none; }
  @media (min-aspect-ratio: 11/10) { #results { left: 38vw; } }
  @media (max-aspect-ratio: 11/10) { #results { top: 30vh; align-items: flex-start; } }
  .rhead { font-family: var(--display); font-size: clamp(20px, 4.6vmin, 40px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); text-align: center; line-height: 1.05; animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { from { transform: scale(0.4); } }
  .rlabel { font: 400 clamp(11px, 2vmin, 15px) var(--display); color: var(--deep); align-self: flex-start; }
  .zrow { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; width: 100%; }
  #results .panel { width: min(680px, 60vw); }
  @media (max-aspect-ratio: 11/10) { #results .panel { width: 96vw; } }
  @media (max-aspect-ratio: 11/10) { .zrow { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .zrow div { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; border-radius: 10px; background: rgba(255,255,255,.75); border: 2px solid rgba(20, 18, 31, 0.15); padding: 2px 0 1px; font-size: clamp(16px, 3vmin, 28px); line-height: 1.1; }
  .zrow div b { font: 400 clamp(9px, 1.6vmin, 12px)/1 var(--display); color: var(--deep); }
  .zrow div.me { border-color: var(--ink); background: #ffe680; box-shadow: 0 0 0 2px var(--yellow); }
  .zrow div img { position: absolute; right: -5px; top: -7px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); background: #ffd27a; }
  .zrow div.same { background: #c8f5dc; }
  .rfact { font-weight: 800; font-size: clamp(13px, 2.4vmin, 18px); text-align: center; max-width: 600px; }
  .rbest { font-weight: 800; font-size: clamp(12px, 2.2vmin, 16px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .rnew { font-family: var(--display); font-size: 13px; color: #fff; background: #ff3d7f; border: 2px solid var(--ink); border-radius: 9px; padding: 1px 7px; transform: rotate(-4deg); }
  @media (max-height: 460px) { .panel { gap: 5px; padding: 8px 12px; border-radius: 24px; border-width: 4px; } .zrow div { font-size: 18px; } .bigbtn { width: 52px; height: 52px; font-size: 24px; border-radius: 16px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); } }

  .shead { font-family: var(--display); font-size: clamp(18px, 4vmin, 32px); color: var(--red); text-align: center; line-height: 1.1; }
  #story .panel { width: min(660px, 96vw); text-align: center; }
  .sart { font-size: clamp(50px, 12vmin, 100px); line-height: 1.05; letter-spacing: 4px; animation: pop 0.45s cubic-bezier(.3, 1.8, .5, 1); }
  .stext { font-weight: 800; font-size: clamp(15px, 3vmin, 23px); line-height: 1.35; max-width: 580px; min-height: 4em; }
  .sdots { display: flex; gap: 8px; }
  .sdots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(20, 18, 31, 0.18); }
  .sdots i.on { background: var(--red); }

  @media (max-height: 460px) { .sart { font-size: 42px; } .stext { font-size: 14px; min-height: 0; } .overlay .panel > .rbtns .ibtn { width: 46px; height: 46px; } }

  #finder .panel { width: min(620px, 96vw); }
  .yearrow { display: flex; align-items: center; gap: clamp(4px, 1.2vmin, 10px); }
  .yearrow .ibtn { color: #fff; background: var(--ink); width: clamp(44px, 8vmin, 60px); height: clamp(44px, 8vmin, 60px); font: 400 clamp(13px, 2.4vmin, 18px) var(--display); border-radius: 16px; }
  .year { font: 400 clamp(40px, 9vmin, 76px)/1 var(--display); color: var(--deep); min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
  .year.typing { color: var(--ink); text-decoration: underline; }
  .fbig { display: flex; align-items: center; gap: 12px; }
  .fbig .emo { font-size: clamp(60px, 14vmin, 120px); line-height: 1; animation: pop 0.4s cubic-bezier(.3, 1.8, .5, 1); }
  .fbig .txt { display: flex; flex-direction: column; gap: 2px; }
  .fbig .nm { font: 400 clamp(22px, 5vmin, 42px)/1 var(--display); color: var(--ink); }
  .fbig .sub { font-weight: 800; font-size: clamp(13px, 2.4vmin, 18px); color: var(--deep); }
  .fnote { font-weight: 700; font-size: clamp(12px, 2.2vmin, 16px); line-height: 1.35; text-align: center; max-width: 540px; background: rgba(255,255,255,.7); border-radius: 14px; padding: 6px 12px; }
  .early { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: clamp(13px, 2.4vmin, 17px); padding: 6px 14px 6px 8px; border-radius: 16px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .early .box { width: 28px; height: 28px; border-radius: 8px; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 18px; }
  .early.on { background: #ffe680; }
  .family { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
  .family .chip { display: flex; align-items: center; gap: 4px; padding: 3px 4px 3px 8px; border-radius: 14px; background: #fff; border: 2px solid var(--ink); font-weight: 800; font-size: clamp(13px, 2.4vmin, 17px); }
  .family .chip .x { width: 26px; height: 26px; border-radius: 8px; background: rgba(20,18,31,.1); font-size: 13px; }
  .savers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(12px, 2.2vmin, 16px); }
  .savers button { width: clamp(40px, 7vmin, 52px); height: clamp(40px, 7vmin, 52px); border-radius: 14px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: clamp(20px, 3.8vmin, 28px); }

  #lineup .panel { width: min(760px, 97vw); }
  .slots { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; width: 100%; }
  @media (max-aspect-ratio: 11/10) { .slots { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .slot { aspect-ratio: 1; border-radius: 12px; border: 3px dashed rgba(20,18,31,.3); display: grid; place-items: center; font-size: clamp(20px, 3.6vmin, 32px); position: relative; }
  .slot b { position: absolute; left: 3px; top: 1px; font: 400 clamp(9px, 1.5vmin, 12px)/1 var(--display); color: var(--deep); }
  .slot.full { border-style: solid; border-color: var(--ink); background: #fff; animation: pop 0.35s cubic-bezier(.3, 1.8, .5, 1); }
  .slot.next { border-color: var(--red); background: #fff0d0; }
  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(6px, 1.4vmin, 12px); width: 100%; }
  .tile { aspect-ratio: 1.15; border-radius: 18px; border: 4px solid #fff; background: #ffd25a; box-shadow: 0 5px 0 var(--ink); font-size: clamp(28px, 6vmin, 56px); line-height: 1; display: grid; place-items: center; }
  .tile.gone { visibility: hidden; }
  .tile.shake { animation: shake 0.4s; background: #ffb3c0; }
  .tile.hint { animation: hint 0.8s ease-in-out infinite; border-color: var(--red); }
  @keyframes shake { 25% { transform: translateX(-8px) rotate(-6deg); } 75% { transform: translateX(8px) rotate(6deg); } }
  @keyframes hint { 50% { transform: scale(1.12) rotate(-5deg); } }
  .lqline { font: 400 clamp(15px, 3.2vmin, 26px) var(--display); color: var(--ink); text-align: center; }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #8fd0f0; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bop 0.5s infinite alternate; display: inline-block; }
  @keyframes bop { to { transform: translateY(-8px) rotate(8deg); } }
  @media (prefers-reduced-motion: reduce) { #loading span, .tile.hint, .ctl.power.ready, .buddybtn.here { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="split" class="hidden"></div>

<!-- home: pick an animal, who races and how hard, then ▶ -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big><em>THE GREAT RACE</em></div>
  <div class="cards" id="cards" role="radiogroup" aria-label="Pick your animal"></div>
  <div class="who" id="who" role="radiogroup" aria-label="Who's racing?">
    <button data-who="teddy" aria-label="Teddy races"><img alt=""><span>TEDDY</span><b class="cups"></b></button>
    <button data-who="tommy" aria-label="Tommy races"><img alt=""><span>TOMMY</span><b class="cups"></b></button>
    <button data-who="both" aria-label="Teddy and Tommy race"><span class="duo"><img alt=""><img alt=""></span><span>BOTH</span></button>
  </div>
  <div class="homerow">
    <div class="lvls" id="lvls"></div>
    <div class="extras">
      <button class="ibtn" id="storyBtn" title="The story (B)" aria-label="The story">📜</button>
      <button class="ibtn" id="finderBtn" title="What animal am I? (Y)" aria-label="What animal am I?">🎂</button>
      <button class="ibtn" id="lineupBtn" title="Line them up! (O)" aria-label="Line them up!">🔢</button>
    </div>
    <button class="bigbtn go" id="playBtn" title="Race! (Enter)" aria-label="Race!">▶</button>
  </div>
</div>

<!-- while racing -->
<div id="hud" class="hidden">
  <div id="track"><div class="flag">🏯</div></div>
  <div class="hudright">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  </div>
</div>
<div id="pads" class="hidden"></div>
<button class="buddybtn hidden" id="buddyBtn" aria-label="Call your brother"><img id="buddyFace" alt=""><kbd>T</kbd></button>
<button class="buddybtn hidden" id="fiveBtn" aria-label="High five">✋<kbd>T</kbd></button>

<div id="toasts"></div>
<div id="bigCount"></div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep racing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start the race again">🔁</button>
    <button class="bigbtn" id="pHome" aria-label="Pick an animal">🏠</button>
  </div>
</div>

<div id="results" class="overlay hidden">
  <div class="panel">
    <div class="rhead" id="rHead"></div>
    <div class="rlabel">THIS RACE</div>
    <div class="zrow" id="rRace"></div>
    <div class="rlabel">THE STORY'S ORDER</div>
    <div class="zrow" id="rStory"></div>
    <div class="rfact" id="rFact"></div>
    <div class="rbest" id="rBest"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="rAgain" aria-label="Play again">🔁</button>
      <button class="bigbtn" id="rHome" aria-label="Pick an animal">🏠</button>
    </div>
  </div>
</div>

<div id="story" class="overlay hidden">
  <div class="panel">
    <div class="shead">THE GREAT RACE</div>
    <div class="sart" id="sArt"></div>
    <div class="stext" id="sText"></div>
    <div class="sdots" id="sDots"></div>
    <div class="rbtns">
      <button class="ibtn" id="sPrev" aria-label="Back a page">◀</button>
      <button class="ibtn" id="sNext" aria-label="Next page">▶</button>
      <button class="ibtn" id="sClose" aria-label="Close the story">✖</button>
    </div>
  </div>
</div>

<div id="finder" class="overlay hidden">
  <div class="panel">
    <button class="ibtn xbtn" id="fClose" aria-label="Close">✖</button>
    <div class="shead">WHAT ANIMAL AM I?</div>
    <div class="yearrow">
      <button class="ibtn" data-dy="-10" aria-label="Ten years back">−10</button>
      <button class="ibtn" data-dy="-1" aria-label="A year back">−1</button>
      <div class="year" id="fYear" aria-live="polite"></div>
      <button class="ibtn" data-dy="1" aria-label="A year on">+1</button>
      <button class="ibtn" data-dy="10" aria-label="Ten years on">+10</button>
    </div>
    <div class="fbig" id="fBig"></div>
    <button class="early" id="fEarly"><span class="box"></span><span id="fEarlyText"></span></button>
    <div class="fnote" id="fNote"><span></span> <b></b></div>
    <div class="savers" id="fSavers"><span>SAVE FOR</span></div>
    <div class="family" id="fFamily"></div>
  </div>
</div>

<div id="lineup" class="overlay hidden">
  <div class="panel">
    <button class="ibtn xbtn" id="lClose" aria-label="Close">✖</button>
    <div class="shead">LINE THEM UP!</div>
    <div class="slots" id="lSlots"></div>
    <div class="lqline" id="lLine"></div>
    <div class="tiles" id="lTiles"></div>
    <div class="rbtns">
      <button class="bigbtn go hidden" id="lAgain" aria-label="Play again">🔁</button>
    </div>
  </div>
</div>

<div id="loading"><span>🐀</span></div>

<script src="kit/three.min.js"></script>
<script src="kit/gfx.js"></script>
<script src="kit/people.js"></script>
<script src="kit/roster.js"></script>
<script src="kit/portraits.js"></script>
<script src="kit/sound.js"></script>
<script src="kit/lang.js"></script>
<script src="kit/help.js"></script>
<script src="js/title.js"></script>
<script src="js/zodiac.js"></script>
<script src="js/race.js"></script>
<script src="js/checks.js"></script>
<script src="js/sfx.js"></script>
<script src="js/animals.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/keys.js"></script>
<script src="js/zh.js"></script>
</body>
</html>
